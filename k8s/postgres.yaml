apiVersion: v1
kind: Secret
metadata:
  name: cadenafrio-db-secret
type: Opaque
stringData:
  username: cadenafrio
  password: cadenafrio_dev
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cadenafrio-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadenafrio-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadenafrio-postgres
  template:
    metadata:
      labels:
        app: cadenafrio-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cadenafriodb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cadenafrio-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cadenafrio-db-secret
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: cadenafrio-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: cadenafrio-postgres
  ports:
    - port: 5432
      targetPort: 5432
