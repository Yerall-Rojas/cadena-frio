services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cadenafriodb
      POSTGRES_USER: cadenafrio
      POSTGRES_PASSWORD: cadenafrio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadenafrio -d cadenafriodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      DB_URL: jdbc:postgresql://postgres:5432/cadenafriodb
      DB_USERNAME: cadenafrio
      DB_PASSWORD: cadenafrio_dev
    ports:
      - "8080:8080"

volumes:
  postgres-data:
