spring.application.name=cadenafrio

# Base de datos H2 en memoria (solo para las pruebas iniciales)
spring.datasource.url=jdbc:h2:mem:cadenafriodb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web para mirar la base de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar el motivo de los errores en las respuestas JSON
server.error.include-message=always
server.error.include-binding-errors=always

# Captcha (reCAPTCHA v2)
captcha.verify-url=https://www.google.com/recaptcha/api/siteverify
captcha.secret=${CAPTCHA_SECRET:}